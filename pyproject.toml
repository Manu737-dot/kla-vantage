[project]
name = "kenya-llm-latency"
version = "0.4.1"
description = "Measure how long LLM API requests take from a home internet connection in Kenya: DNS, TCP, TLS, time to first byte, routes, and AI time to first token."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pycurl>=7.45.3",
    "dnspython>=2.6",
    "PyYAML>=6.0",
    "matplotlib>=3.10",
    "python-dotenv>=1.0",
]

[project.scripts]
kla = "kla.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kla"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]
# ANN401: Any is fine for JSON-ish values. RUF001-3: the report deliberately uses
# typographic characters such as "–", "≈" and "×".
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
